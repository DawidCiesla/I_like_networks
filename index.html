<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>I Like Transit — Bus Era</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="transport-canvas" aria-label="3D passenger transport city"></canvas>

      <button class="menu-chip" aria-label="Menu">≡</button>

      <section class="resource-box pixel-window" aria-label="Resources">
        <div class="window-title">RESOURCES</div>
        <div class="resource-line">
          <span class="coin-dot"></span>
          <strong id="money-value">0</strong>
          <span id="income-value" class="resource-delta">LAST —</span>
        </div>
        <div class="resource-line">
          <span class="passenger-dot"></span>
          <strong id="throughput-value">0 pax/min</strong>
        </div>
      </section>

      <div class="status-wrap">
        <div class="speed-box pixel-window">
          <button data-speed="0" aria-label="Pause">Ⅱ</button>
          <div class="speed-popover">
            <button data-speed="1" class="active">1×</button>
            <button data-speed="2">2×</button>
            <button data-speed="4">4×</button>
          </div>
        </div>

        <section class="message-bar pixel-window">
          <div class="face-icon">⌣</div>
          <div id="objective-text">Click the next station on the map.</div>
          <span class="message-tag">BUS ERA ↓</span>
        </section>
      </div>

      <section class="legend-box pixel-window" aria-label="Legend">
        <div class="window-title legend-title">LINES</div>

        <div class="transit-legend-row">
          <span class="legend-line blue"></span>
          <span>1 BUS</span>
        </div>

        <div class="transit-legend-row">
          <span class="legend-line yellow"></span>
          <span>2 BUS</span>
        </div>

        <div class="transit-legend-row">
          <span class="legend-line green"></span>
          <span>3 BUS</span>
        </div>

        <div class="transit-legend-row">
          <span class="legend-line magenta"></span>
          <span>4 BUS</span>
        </div>

        <div class="legend-separator"></div>

        <div id="progress-text" class="bus-era-progress">
          1 / 5 STOPS
        </div>
      </section>

      <section id="inspector-panel" class="inspector-panel pixel-window hidden" aria-label="Selected transport element">
        <div class="panel-heading-row">
          <div>
            <div id="inspector-kicker" class="inspector-kicker">SELECTED</div>
            <div id="inspector-title" class="inspector-title">Transport element</div>
          </div>

          <button id="inspector-close" class="panel-close" type="button" aria-label="Close inspector">×</button>
        </div>

        <div id="inspector-subtitle" class="inspector-subtitle"></div>
        <div id="inspector-stats" class="inspector-stats"></div>
        <div id="inspector-actions" class="inspector-actions"></div>
      </section>

      <button id="reset-button" class="reset-button" type="button" title="Erase all progress and restart">
        RESET GAME
      </button>

      <div class="hint">
        CLICK TO SELECT • LEFT DRAG TO ROTATE • RIGHT DRAG TO PAN • WHEEL TO ZOOM
      </div>

      <div id="toast" class="toast pixel-window" aria-live="polite"></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
