<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>I Like Networks — Phase 1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="network-canvas" aria-label="Network map"></canvas>

      <button class="menu-chip" aria-label="Menu">≡</button>

      <section class="resource-box pixel-window" aria-label="Resources">
        <div class="window-title">RESOURCES</div>
        <div class="resource-line"><span class="coin-dot"></span><strong id="money-value">0</strong><span id="income-value" class="resource-delta">+0</span></div>
        <div class="resource-line"><span class="data-diamond"></span><strong id="throughput-value">0 Mb/s</strong></div>
      </section>

      <div class="status-wrap">
        <div class="speed-box pixel-window">
          <button data-speed="0" aria-label="Pause">Ⅱ</button>
          <div class="speed-popover">
            <button data-speed="1" class="active">1×</button>
            <button data-speed="2">2×</button>
            <button data-speed="4">4×</button>
          </div>
        </div>

        <section class="message-bar pixel-window">
          <div class="face-icon">⌣</div>
          <div id="objective-text">Connect the client to the server.</div>
          <span class="message-tag">New ↓</span>
        </section>
      </div>

      <section class="legend-box pixel-window" aria-label="Legend">
        <div class="window-title legend-title">LEGEND</div>
        <div class="legend-row"><span class="legend-line blue"></span><span class="legend-port blue"></span></div>
        <div class="legend-row"><span class="legend-line green"></span><span class="legend-port green"></span></div>
        <div class="legend-row"><span class="legend-line yellow"></span><span class="legend-port yellow"></span></div>
        <div class="legend-row"><span class="legend-line magenta dashed"></span><span class="legend-port magenta"></span></div>
        <div class="legend-separator"></div>
        <div class="legend-icons">
          <button title="Network">⌂</button>
          <button title="Settings">⚙</button>
          <button title="World">◎</button>
        </div>
      </section>

      <section class="network-panel pixel-window" id="control-panel">
        <div class="panel-title">
          <span class="globe-icon">⊕</span>
          <span>Network Link</span>
        </div>
        <div class="dash-divider"></div>

        <button id="connect-button" class="connect-row">
          <span class="row-icon cable-icon">⇄</span>
          <span class="row-copy">
            <strong>Ethernet Link</strong>
            <small id="connect-subtitle">Client ↔ Server</small>
          </span>
          <span class="buy-pill"><span id="connect-cost">$40</span></span>
        </button>

        <button class="upgrade-row" data-upgrade="client">
          <span class="row-icon client-color">▣</span>
          <span class="row-copy">
            <strong>Client NIC</strong>
            <small>+5 Mb/s demand</small>
          </span>
          <span class="row-cost"><span class="coin-dot tiny"></span><strong id="client-upgrade-cost">$25</strong></span>
          <span class="buy-pill">Buy</span>
        </button>

        <button class="upgrade-row" data-upgrade="link">
          <span class="row-icon blue-color">╪</span>
          <span class="row-copy">
            <strong>Link Capacity</strong>
            <small>+20 Mb/s</small>
          </span>
          <span class="row-cost"><span class="coin-dot tiny"></span><strong id="link-upgrade-cost">$35</strong></span>
          <span class="buy-pill">Buy</span>
        </button>

        <button class="upgrade-row" data-upgrade="server">
          <span class="row-icon server-color">▥</span>
          <span class="row-copy">
            <strong>Server Uplink</strong>
            <small>+15 Mb/s capacity</small>
          </span>
          <span class="row-cost"><span class="coin-dot tiny"></span><strong id="server-upgrade-cost">$45</strong></span>
          <span class="buy-pill">Buy</span>
        </button>

        <div class="dash-divider"></div>
        <div class="mini-stats">
          <div><span>CLIENT</span><strong id="demand-value">10 Mb/s</strong></div>
          <div><span>LINK</span><strong id="capacity-value">—</strong></div>
          <div><span>SERVER</span><strong id="server-value">25 Mb/s</strong></div>
          <div><span>LOAD</span><strong id="utilization-value">0%</strong></div>
        </div>
      </section>

      <button id="reset-button" class="reset-button">RESET NETWORK</button>
      <div class="hint">DRAG TO PAN • WHEEL TO ZOOM • CLICK A NODE</div>
      <div id="toast" class="toast pixel-window" aria-live="polite"></div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
