<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>I Like Networks — Phase 3</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="network-canvas" aria-label="Network map"></canvas>

      <button class="menu-chip" aria-label="Menu">≡</button>

      <section class="resource-box pixel-window" aria-label="Resources">
        <div class="window-title">RESOURCES</div>
        <div class="resource-line">
          <span class="coin-dot"></span>
          <strong id="money-value">0</strong>
          <span id="income-value" class="resource-delta">+0</span>
        </div>
        <div class="resource-line">
          <span class="data-diamond"></span>
          <strong id="throughput-value">0 Mb/s</strong>
        </div>
      </section>

      <div class="status-wrap">
        <div class="speed-box pixel-window">
          <button data-speed="0" aria-label="Pause">Ⅱ</button>
          <div class="speed-popover">
            <button data-speed="1" class="active">1×</button>
            <button data-speed="2">2×</button>
            <button data-speed="4">4×</button>
          </div>
        </div>

        <section class="message-bar pixel-window">
          <div class="face-icon">⌣</div>
          <div id="objective-text">Build your network without replacing what is already there.</div>
          <span class="message-tag">Network ↓</span>
        </section>
      </div>

      <section class="legend-box pixel-window" aria-label="Legend">
        <div class="window-title legend-title">LEGEND</div>
        <div class="legend-row"><span class="legend-line blue"></span><span class="legend-port blue"></span></div>
        <div class="legend-row"><span class="legend-line green"></span><span class="legend-port green"></span></div>
        <div class="legend-row"><span class="legend-line yellow"></span><span class="legend-port yellow"></span></div>
        <div class="legend-row"><span class="legend-line magenta dashed"></span><span class="legend-port magenta"></span></div>
        <div class="legend-separator"></div>
        <div class="legend-icons">
          <button title="Network">⌂</button>
          <button title="Settings">⚙</button>
          <button title="World">◎</button>
        </div>
      </section>

      <div class="build-dock">
        <button id="build-menu-button" class="build-menu-button pixel-window" type="button">
          <span class="build-plus">＋</span>
          <span>BUILD</span>
        </button>

        <section id="build-panel" class="build-panel pixel-window hidden" aria-label="Build menu">
          <div class="panel-heading-row">
            <div class="window-title">BUILD</div>
            <button id="build-panel-close" class="panel-close" type="button" aria-label="Close build menu">×</button>
          </div>
          <div id="build-list" class="build-list"></div>
          <div id="build-empty" class="build-empty hidden">Nothing new to build right now.</div>
        </section>
      </div>

      <section id="inspector-panel" class="inspector-panel pixel-window hidden" aria-label="Selected network element">
        <div class="panel-heading-row">
          <div>
            <div id="inspector-kicker" class="inspector-kicker">SELECTED</div>
            <div id="inspector-title" class="inspector-title">Network element</div>
          </div>
          <button id="inspector-close" class="panel-close" type="button" aria-label="Close inspector">×</button>
        </div>

        <div id="inspector-subtitle" class="inspector-subtitle"></div>
        <div id="inspector-stats" class="inspector-stats"></div>
        <div id="inspector-actions" class="inspector-actions"></div>

        <section id="inspector-routes" class="inspector-routes hidden">
          <div class="dash-divider"></div>
          <div class="window-title">ROUTING TABLE</div>
          <div class="route-head">
            <span>DESTINATION</span>
            <span>NEXT</span>
          </div>
          <div id="route-table-body"></div>
          <div class="route-traffic">
            <div><span>SERVER A</span><strong id="route-a-throughput">0 Mb/s</strong></div>
            <div><span>SERVER B</span><strong id="route-b-throughput">0 Mb/s</strong></div>
          </div>
        </section>
      </section>

      <button id="reset-button" class="reset-button">RESET NETWORK</button>
      <div class="hint">CLICK A DEVICE TO INSPECT • DRAG TO PAN • WHEEL TO ZOOM</div>
      <div id="toast" class="toast pixel-window" aria-live="polite"></div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
